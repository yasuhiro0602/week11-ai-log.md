<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub ユーザー検索ツール</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 md:p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">GitHub ユーザー検索</h1>

    <div class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="usernameInput" 
        placeholder="GitHubユーザー名を入力..." 
        class="flex-1 border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500"
      >
      <button 
        id="searchBtn" 
        onclick="fetchGitHubUser()" 
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded transition duration-200"
      >
        検索
      </button>
    </div>

   
    <div id="loading" class="text-center py-4 text-blue-600 font-semibold hidden">
      読み込み中...
    </div>

    
    <div id="errorMessage" class="text-center py-4 text-red-500 font-bold hidden"></div>

    
    <div id="userCard" class="border border-gray-200 rounded-lg p-5 hidden text-center">
     
      <img id="avatar" src="" alt="アバター画像" class="w-24 h-24 rounded-full mx-auto mb-4 border-2 border-gray-200 shadow-sm object-cover">
      
      
      <h2 id="name" class="text-xl font-bold text-gray-800"></h2>
      
     
      <p id="bio" class="text-gray-600 text-sm mt-2 mb-4 leading-relaxed"></p>

     
      <div class="flex justify-around bg-gray-50 py-3 rounded mb-4">
        <div>
          <span class="block text-xs text-gray-500">フォロワー</span>
          <span id="followers" class="text-lg font-bold text-gray-800">0</span>
        </div>
        
        <div>
          <span class="block text-xs text-gray-500">リポジトリ</span>
          <span id="repos" class="text-lg font-bold text-gray-800">0</span>
        </div>
      </div>

      
      <a 
        id="profileLink" 
        href="#" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="inline-block bg-gray-800 hover:bg-black text-white text-sm font-semibold px-4 py-2 rounded transition duration-200"
      >
        GitHubで見る
      </a>
    </div>

  </div>

  <script>
    async function fetchGitHubUser() {
      const username = document.getElementById('usernameInput').value.trim();
      const loading = document.getElementById('loading');
      const errorMessage = document.getElementById('errorMessage');
      const userCard = document.getElementById('userCard');
      const searchBtn = document.getElementById('searchBtn');

     
      errorMessage.classList.add('hidden');
      userCard.classList.add('hidden');

    
      if (!username) {
        errorMessage.textContent = 'ユーザー名を入力してください。';
        errorMessage.classList.remove('hidden');
        return;
      }

      
      loading.classList.remove('hidden');
      searchBtn.disabled = true;

      try {
        
        const response = await fetch(`https://api.github.com/users/${username}`);

       
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('ユーザーが見つかりませんでした');
          } else {
            throw new Error(`エラーが発生しました（ステータス: ${response.status}）`);
          }
        }

        
        const data = await response.json();

        
        console.log('取得したGitHubユーザーデータ:', data);

        
        document.getElementById('avatar').src = data.avatar_url;
        document.getElementById('name').textContent = data.name || data.login; // 名前が未設定の場合はユーザー名
        document.getElementById('bio').textContent = data.bio || '自己紹介文はありません。';
        document.getElementById('followers').textContent = data.followers;
        
        
        document.getElementById('repos').textContent = data.public_repos;
        document.getElementById('profileLink').href = data.html_url;

        
        userCard.classList.remove('hidden');

      } catch (error) {
        
        console.error('通信エラー:', error);
        errorMessage.textContent = error.message;
        errorMessage.classList.remove('hidden');
      } finally {
       
        loading.classList.add('hidden');
        searchBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
